<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Memory Dashboard</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: #0d1117;
    color: #c9d1d9;
    line-height: 1.5;
    overflow: hidden;
    height: 100vh;
  }

  /* --- Top Nav --- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 0 24px;
    height: 56px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
  }
  .topbar h1 {
    font-size: 18px;
    font-weight: 600;
    color: #58a6ff;
    white-space: nowrap;
  }
  .tabs {
    display: flex;
    gap: 4px;
    margin-left: auto;
  }
  .tab-btn {
    background: transparent;
    color: #8b949e;
    border: none;
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
    transition: background .15s, color .15s;
  }
  .tab-btn:hover { background: #21262d; color: #c9d1d9; }
  .tab-btn.active { background: #30363d; color: #f0f6fc; }

  /* --- Layout --- */
  .view { display: none; height: calc(100vh - 56px); }
  .view.active { display: flex; }

  /* --- Timeline View --- */
  #timeline-view { display: none; }
  #timeline-view.active { display: flex; }

  .sidebar {
    width: 280px;
    min-width: 280px;
    background: #161b22;
    border-right: 1px solid #30363d;
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .sidebar label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #8b949e;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin-bottom: 6px;
  }
  .sidebar select, .sidebar input {
    width: 100%;
    padding: 8px 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    font-size: 14px;
    outline: none;
    transition: border-color .15s;
  }
  .sidebar select:focus, .sidebar input:focus { border-color: #58a6ff; }

  .stats-box {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 16px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 14px;
  }
  .stat-row .stat-val {
    font-weight: 600;
    color: #58a6ff;
  }

  /* --- Main content area --- */
  .main-content {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  /* --- Memory Cards --- */
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 800px;
    margin: 0 auto;
  }
  .memory-card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 16px;
    cursor: pointer;
    transition: border-color .15s, box-shadow .15s;
  }
  .memory-card:hover {
    border-color: #58a6ff;
    box-shadow: 0 0 0 1px #58a6ff22;
  }
  .card-header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .badge-id {
    font-size: 12px;
    font-family: monospace;
    background: #21262d;
    padding: 2px 8px;
    border-radius: 4px;
    color: #8b949e;
  }
  .badge-type {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .5px;
    padding: 2px 10px;
    border-radius: 12px;
    color: #0d1117;
  }
  .badge-type.narrative   { background: #d2a8ff; }
  .badge-type.note        { background: #58a6ff; }
  .badge-type.session_log { background: #3fb950; }

  .badge-project {
    font-size: 11px;
    background: #30363d;
    padding: 2px 8px;
    border-radius: 4px;
    color: #c9d1d9;
    margin-left: auto;
  }

  .card-content {
    font-size: 14px;
    color: #c9d1d9;
    margin-bottom: 10px;
    white-space: pre-wrap;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #8b949e;
  }
  .importance-bar {
    display: flex;
    gap: 3px;
    align-items: center;
  }
  .importance-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #21262d;
  }
  .importance-dot.filled {
    background: #58a6ff;
  }
  .conn-count {
    font-size: 12px;
    color: #58a6ff;
    cursor: pointer;
  }

  .load-more-btn {
    display: block;
    margin: 24px auto;
    padding: 10px 28px;
    background: #21262d;
    color: #c9d1d9;
    border: 1px solid #30363d;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s;
  }
  .load-more-btn:hover { background: #30363d; }
  .load-more-btn:disabled { opacity: .4; cursor: default; }

  .no-results {
    text-align: center;
    color: #8b949e;
    padding: 48px 0;
    font-size: 15px;
  }

  /* --- Slide-out detail panel --- */
  .detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
  }
  .detail-overlay.open { display: flex; }
  .detail-backdrop {
    flex: 1;
    background: rgba(0,0,0,.5);
  }
  .detail-panel {
    width: 480px;
    max-width: 90vw;
    background: #161b22;
    border-left: 1px solid #30363d;
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .detail-panel h2 { font-size: 16px; color: #f0f6fc; }
  .detail-panel .detail-content {
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.6;
    color: #c9d1d9;
    background: #0d1117;
    border-radius: 6px;
    padding: 16px;
    border: 1px solid #30363d;
  }
  .detail-panel .detail-meta {
    font-size: 13px;
    color: #8b949e;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .detail-panel .conn-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .conn-item {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    padding: 12px;
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s;
  }
  .conn-item:hover { border-color: #58a6ff; }
  .conn-rel {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: #58a6ff;
    margin-bottom: 4px;
  }
  .close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: transparent;
    border: none;
    color: #8b949e;
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
  }
  .close-btn:hover { color: #f0f6fc; }

  /* --- Graph View --- */
  #graph-view {
    flex-direction: column;
  }
  .graph-toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 24px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
  }
  .graph-toolbar select {
    padding: 6px 12px;
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 6px;
    color: #c9d1d9;
    font-size: 14px;
    outline: none;
  }
  .graph-toolbar select:focus { border-color: #58a6ff; }
  .graph-toolbar label {
    font-size: 13px;
    color: #8b949e;
  }
  #graph-container {
    flex: 1;
    width: 100%;
  }

  /* --- Responsive --- */
  @media (max-width: 768px) {
    .sidebar { display: none; }
    .detail-panel { width: 100vw; }
    .card-list { padding: 0 4px; }
  }
</style>
</head>
<body>

<!-- Top Navigation -->
<div class="topbar">
  <h1>LLM Memory</h1>
  <div class="tabs">
    <button class="tab-btn active" data-view="timeline">Timeline</button>
    <button class="tab-btn" data-view="graph">Graph</button>
  </div>
</div>

<!-- Timeline View -->
<div id="timeline-view" class="view active">
  <aside class="sidebar">
    <div>
      <label>Project</label>
      <select id="filter-project">
        <option value="">All Projects</option>
      </select>
    </div>
    <div>
      <label>Type</label>
      <select id="filter-type">
        <option value="">All Types</option>
        <option value="narrative">Narrative</option>
        <option value="note">Note</option>
        <option value="session_log">Session Log</option>
      </select>
    </div>
    <div>
      <label>Search</label>
      <input type="text" id="filter-search" placeholder="Search memories...">
    </div>
    <div class="stats-box">
      <div class="stat-row"><span>Memories</span><span class="stat-val" id="stat-memories">--</span></div>
      <div class="stat-row"><span>Connections</span><span class="stat-val" id="stat-connections">--</span></div>
      <div class="stat-row"><span>Projects</span><span class="stat-val" id="stat-projects">--</span></div>
    </div>
  </aside>

  <div class="main-content">
    <div class="card-list" id="card-list"></div>
    <button class="load-more-btn" id="load-more-btn" style="display:none;">Load more</button>
    <div class="no-results" id="no-results" style="display:none;">No memories found.</div>
  </div>
</div>

<!-- Graph View -->
<div id="graph-view" class="view">
  <div class="graph-toolbar">
    <label>Project:</label>
    <select id="graph-project-filter">
      <option value="">All Projects</option>
    </select>
  </div>
  <div id="graph-container"></div>
</div>

<!-- Detail Slide-out -->
<div class="detail-overlay" id="detail-overlay">
  <div class="detail-backdrop" id="detail-backdrop"></div>
  <div class="detail-panel" style="position:relative;">
    <button class="close-btn" id="detail-close">&times;</button>
    <h2 id="detail-title">Memory Detail</h2>
    <div class="detail-meta" id="detail-meta"></div>
    <div class="detail-content" id="detail-content"></div>
    <h2 id="detail-conn-title" style="display:none;">Connections</h2>
    <div class="conn-list" id="detail-connections"></div>
  </div>
</div>

{% raw %}
<script>
(function() {
  // --- Constants ---
  const TYPE_COLORS = {
    narrative: '#d2a8ff',
    note: '#58a6ff',
    session_log: '#3fb950'
  };
  const PAGE_SIZE = 20;

  // --- State ---
  let memories = [];
  let offset = 0;
  let hasMore = true;
  let loading = false;
  let graphNetwork = null;
  let statsData = null;

  // --- DOM refs ---
  const cardList = document.getElementById('card-list');
  const loadMoreBtn = document.getElementById('load-more-btn');
  const noResults = document.getElementById('no-results');
  const filterProject = document.getElementById('filter-project');
  const filterType = document.getElementById('filter-type');
  const filterSearch = document.getElementById('filter-search');
  const detailOverlay = document.getElementById('detail-overlay');
  const detailMeta = document.getElementById('detail-meta');
  const detailContent = document.getElementById('detail-content');
  const detailConnections = document.getElementById('detail-connections');
  const detailConnTitle = document.getElementById('detail-conn-title');
  const graphProjectFilter = document.getElementById('graph-project-filter');

  // --- Utility: relative time ---
  function relativeTime(dateStr) {
    const now = new Date();
    const date = new Date(dateStr);
    const diffMs = now - date;
    const seconds = Math.floor(diffMs / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    const weeks = Math.floor(days / 7);
    const months = Math.floor(days / 30);

    if (seconds < 60) return 'just now';
    if (minutes < 60) return minutes + 'm ago';
    if (hours < 24) return hours + 'h ago';
    if (days === 1) return 'yesterday';
    if (days < 7) return days + 'd ago';
    if (weeks < 5) return weeks + 'w ago';
    if (months < 12) return months + 'mo ago';
    return date.toLocaleDateString();
  }

  // --- Utility: debounce ---
  function debounce(fn, ms) {
    let timer;
    return function() {
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(this, arguments), ms);
    };
  }

  // --- Utility: importance dots ---
  function importanceDots(level) {
    let html = '<div class="importance-bar" title="Importance: ' + level + '/10">';
    for (let i = 1; i <= 10; i++) {
      const filled = i <= level ? ' filled' : '';
      const opacity = i <= level ? 'opacity:' + (0.3 + 0.7 * (i / 10)) : '';
      html += '<div class="importance-dot' + filled + '" style="' + opacity + '"></div>';
    }
    html += '</div>';
    return html;
  }

  // --- Utility: escape HTML ---
  function esc(str) {
    if (!str) return '';
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  // --- API helpers ---
  async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error('API error: ' + res.status);
    return res.json();
  }

  // --- Load stats and populate filters ---
  async function loadStats() {
    try {
      statsData = await fetchJSON('/api/stats');
      document.getElementById('stat-memories').textContent = statsData.total_memories || 0;
      document.getElementById('stat-connections').textContent = statsData.total_connections || 0;
      const projects = statsData.projects || [];
      document.getElementById('stat-projects').textContent = projects.length;

      // Populate project dropdowns
      [filterProject, graphProjectFilter].forEach(sel => {
        // Clear existing options beyond "All"
        while (sel.options.length > 1) sel.remove(1);
        projects.forEach(p => {
          const name = typeof p === 'string' ? p : (p.name || p.project || '');
          if (name) {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            sel.appendChild(opt);
          }
        });
      });
    } catch (e) {
      console.error('Failed to load stats:', e);
    }
  }

  // --- Build query string for memories ---
  function buildQuery() {
    const params = new URLSearchParams();
    params.set('limit', PAGE_SIZE);
    params.set('offset', offset);
    const project = filterProject.value;
    const type = filterType.value;
    const search = filterSearch.value.trim();
    if (project) params.set('project', project);
    if (type) params.set('type', type);
    if (search) params.set('q', search);
    return params.toString();
  }

  // --- Render a single memory card ---
  function renderCard(mem) {
    const typeClass = (mem.type || 'note').replace(/\s+/g, '_').toLowerCase();
    const connections = mem.connections_count || mem.connections || 0;

    const card = document.createElement('div');
    card.className = 'memory-card';
    card.setAttribute('data-id', mem.id);
    card.innerHTML =
      '<div class="card-header">' +
        '<span class="badge-id">#' + esc(String(mem.id)) + '</span>' +
        '<span class="badge-type ' + esc(typeClass) + '">' + esc(mem.type || 'note') + '</span>' +
        (mem.project ? '<span class="badge-project">' + esc(mem.project) + '</span>' : '') +
      '</div>' +
      '<div class="card-content">' + esc(mem.content || '') + '</div>' +
      '<div class="card-footer">' +
        importanceDots(mem.importance || 5) +
        '<span>' + relativeTime(mem.created_at) + '</span>' +
        (connections > 0 ? '<span class="conn-count">' + connections + ' connection' + (connections !== 1 ? 's' : '') + '</span>' : '') +
      '</div>';
    card.addEventListener('click', () => openDetail(mem.id));
    return card;
  }

  // --- Load memories ---
  async function loadMemories(append) {
    if (loading) return;
    loading = true;
    loadMoreBtn.disabled = true;

    try {
      const data = await fetchJSON('/api/memories?' + buildQuery());
      const items = Array.isArray(data) ? data : (data.memories || data.items || []);

      if (!append) {
        cardList.innerHTML = '';
        memories = [];
      }

      items.forEach(mem => {
        memories.push(mem);
        cardList.appendChild(renderCard(mem));
      });

      hasMore = items.length >= PAGE_SIZE;
      loadMoreBtn.style.display = hasMore ? 'block' : 'none';
      noResults.style.display = (memories.length === 0) ? 'block' : 'none';
    } catch (e) {
      console.error('Failed to load memories:', e);
      if (!append) {
        cardList.innerHTML = '';
        noResults.style.display = 'block';
        noResults.textContent = 'Failed to load memories.';
      }
    } finally {
      loading = false;
      loadMoreBtn.disabled = false;
    }
  }

  // --- Reset and reload ---
  function resetAndLoad() {
    offset = 0;
    hasMore = true;
    loadMemories(false);
  }

  // --- Load more ---
  loadMoreBtn.addEventListener('click', () => {
    offset += PAGE_SIZE;
    loadMemories(true);
  });

  // --- Filter events ---
  filterProject.addEventListener('change', resetAndLoad);
  filterType.addEventListener('change', resetAndLoad);
  filterSearch.addEventListener('input', debounce(resetAndLoad, 300));

  // --- Detail panel ---
  async function openDetail(id) {
    try {
      const mem = await fetchJSON('/api/memory/' + id);
      document.getElementById('detail-title').textContent = 'Memory #' + id;
      detailContent.textContent = mem.content || '';

      detailMeta.innerHTML =
        '<span><strong>Type:</strong> ' + esc(mem.type || 'note') + '</span>' +
        '<span><strong>Project:</strong> ' + esc(mem.project || '--') + '</span>' +
        '<span><strong>Importance:</strong> ' + (mem.importance || 'N/A') + ' / 10</span>' +
        '<span><strong>Created:</strong> ' + esc(mem.created_at || '') + '</span>' +
        (mem.updated_at ? '<span><strong>Updated:</strong> ' + esc(mem.updated_at) + '</span>' : '') +
        (mem.transcript_ref ? '<span><strong>Transcript:</strong> <code style="font-size:12px;background:#21262d;padding:2px 6px;border-radius:3px;">' + esc(mem.transcript_ref) + '</code></span>' : '');

      // Connections — API returns {outgoing: [...], incoming: [...]}
      const connData = mem.connections || {};
      const outgoing = connData.outgoing || [];
      const incoming = connData.incoming || [];
      detailConnections.innerHTML = '';
      if (outgoing.length > 0 || incoming.length > 0) {
        detailConnTitle.style.display = 'block';
        outgoing.forEach(c => {
          const item = document.createElement('div');
          item.className = 'conn-item';
          const preview = (c.memory && c.memory.content) ? c.memory.content.substring(0, 150) : ('Memory #' + c.to_id);
          item.innerHTML =
            '<div class="conn-rel">' + esc(c.relationship) + ' → #' + c.to_id + '</div>' +
            '<div>' + esc(preview) + '</div>';
          item.addEventListener('click', () => openDetail(c.to_id));
          detailConnections.appendChild(item);
        });
        incoming.forEach(c => {
          const item = document.createElement('div');
          item.className = 'conn-item';
          const preview = (c.memory && c.memory.content) ? c.memory.content.substring(0, 150) : ('Memory #' + c.from_id);
          item.innerHTML =
            '<div class="conn-rel">#' + c.from_id + ' ' + esc(c.relationship) + ' → this</div>' +
            '<div>' + esc(preview) + '</div>';
          item.addEventListener('click', () => openDetail(c.from_id));
          detailConnections.appendChild(item);
        });
      } else {
        detailConnTitle.style.display = 'none';
      }

      detailOverlay.classList.add('open');
    } catch (e) {
      console.error('Failed to load detail:', e);
    }
  }

  function closeDetail() {
    detailOverlay.classList.remove('open');
  }
  document.getElementById('detail-close').addEventListener('click', closeDetail);
  document.getElementById('detail-backdrop').addEventListener('click', closeDetail);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDetail();
  });

  // --- Tab switching ---
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const view = btn.getAttribute('data-view');
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(view + '-view').classList.add('active');
      if (view === 'graph' && !graphNetwork) {
        loadGraph();
      }
    });
  });

  // --- Graph ---
  async function loadGraph() {
    const container = document.getElementById('graph-container');
    container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#8b949e;">Loading graph...</div>';

    try {
      const projectParam = graphProjectFilter.value;
      const url = projectParam ? '/api/graph?project=' + encodeURIComponent(projectParam) : '/api/graph';
      const data = await fetchJSON(url);

      const rawNodes = data.nodes || [];
      const rawEdges = data.edges || data.connections || [];

      const nodes = new vis.DataSet(rawNodes.map(n => {
        const typeColor = TYPE_COLORS[(n.type || 'note').toLowerCase()] || '#8b949e';
        const importance = n.importance || 5;
        const size = 10 + importance * 3;
        const preview = (n.content || '').substring(0, 120);
        return {
          id: n.id,
          label: '#' + n.id,
          title: '<strong>' + esc(n.type || '') + '</strong> (' + esc(n.project || '') + ')<br>' + esc(preview),
          color: {
            background: typeColor,
            border: typeColor,
            highlight: { background: typeColor, border: '#f0f6fc' },
            hover: { background: typeColor, border: '#f0f6fc' }
          },
          size: size,
          font: { color: '#c9d1d9', size: 11 }
        };
      }));

      const edges = new vis.DataSet(rawEdges.map((e, i) => ({
        id: e.id || i,
        from: e.from || e.source_id || e.from_id,
        to: e.to || e.target_id || e.to_id,
        label: e.relationship || e.type || '',
        color: { color: '#30363d', highlight: '#58a6ff', hover: '#58a6ff' },
        font: { color: '#8b949e', size: 10, strokeWidth: 0 },
        arrows: 'to',
        smooth: { type: 'continuous' }
      })));

      container.innerHTML = '';
      graphNetwork = new vis.Network(container, { nodes, edges }, {
        physics: {
          forceAtlas2Based: {
            gravitationalConstant: -40,
            centralGravity: 0.005,
            springLength: 150,
            springConstant: 0.02
          },
          solver: 'forceAtlas2Based',
          stabilization: { iterations: 150 }
        },
        interaction: {
          hover: true,
          tooltipDelay: 150,
          navigationButtons: false,
          keyboard: true
        },
        nodes: {
          shape: 'dot',
          borderWidth: 2
        },
        edges: {
          width: 1.5
        }
      });

      graphNetwork.on('click', params => {
        if (params.nodes.length > 0) {
          openDetail(params.nodes[0]);
        }
      });

    } catch (e) {
      console.error('Failed to load graph:', e);
      container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#f85149;">Failed to load graph data.</div>';
    }
  }

  graphProjectFilter.addEventListener('change', () => {
    graphNetwork = null;
    loadGraph();
  });

  // --- Init ---
  loadStats();
  resetAndLoad();
})();
</script>
