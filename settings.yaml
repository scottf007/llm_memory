# Shared Claude Code settings - machine-independent
# Run install.sh to apply these to ~/.claude/settings.json

# Tool permissions: allow these tools without prompting each time
permissions:
  - "Bash(python:*)"
  - "Bash(python3:*)"
  - "Bash(ls:*)"
  - "Bash(find:*)"
  - "Bash(grep:*)"
  - "Bash(sqlite3:*)"
  - "Bash(curl:*)"
  - "Bash(chmod +x:*)"
  - "Bash(pip install:*)"
  - "Bash(ssh:*)"
  - "Bash(scp:*)"
  - "Bash(git:*)"
  - "Bash(python -m pytest:*)"
  - "WebSearch"
  # File ops on the memory dir — needed by /narrative so the delta-extractor
  # subagent can write deltas to ~/.claude/memory/deltas/ without prompting.
  # Without these, every /narrative run prompts ~4× and parent-Claude tends
  # to invent a /tmp workaround that triggers more prompts.
  # "~" is expanded to the installing user's home directory by
  # apply_settings.py — do not hardcode an absolute path here.
  - "Write(~/.claude/memory/**)"
  - "Edit(~/.claude/memory/**)"
  # MCP memory server tools (the 4 tools server.py actually exposes)
  - "mcp__llm_memory__memory_search"
  - "mcp__llm_memory__narrative_coverage"
  - "mcp__llm_memory__project_lookup"
  - "mcp__llm_memory__resume"

# Hook scripts (paths resolved relative to llm_memory install dir at install time)
hooks:
  # Runs on session startup/resume/compact — loads context and checks for narrative updates
  SessionStart:
    matcher: "startup|resume|compact"
    script: session_start.sh
    timeout: 5
  # Runs after each tool use — monitors session activity
  PostToolUse:
    - matcher: ""
      script: session_monitor.sh
      timeout: 5
    # Records timestamp of last memory save for staleness checks
    - matcher: "mcp__llm_memory__memory_store"
      command: "date +%s > /tmp/llm_memory_last_save"
      async: true
  # Runs before context compaction — preserves important context
  PreCompact:
    matcher: ""
    script: pre_compact.sh
    timeout: 5
  # Runs on session end — saves session log asynchronously
  SessionEnd:
    matcher: ""
    script: session_end.sh
    timeout: 10
    async: true
